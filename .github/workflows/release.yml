name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build universal app
        run: ./scripts/build-release.sh

      - name: Create DMG
        run: ./scripts/create-dmg.sh

      - name: Prepare Sparkle update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          ARCHIVE="ScreenshotShelf-${VERSION}.dmg"
          mkdir -p updates docs
          cp dist/ScreenshotShelf.dmg "updates/${ARCHIVE}"
          printf '# ScreenshotShelf %s\n\nSee the GitHub release for changes.\n' "$VERSION" \
            > "updates/ScreenshotShelf-${VERSION}.md"

          if curl --fail --silent --show-error \
            "https://miguelrrl.github.io/ScreenshotShelf/appcast.xml" \
            --output updates/appcast.xml; then
            echo "Using existing appcast"
          else
            echo "Creating first appcast"
            unlink updates/appcast.xml 2>/dev/null || true
          fi

          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build-arm64/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix \
              "https://github.com/Miguelrrl/ScreenshotShelf/releases/download/${TAG}/" \
              --link "https://github.com/Miguelrrl/ScreenshotShelf" \
              --maximum-deltas 0 \
              --maximum-versions 5 \
              updates

          cp updates/appcast.xml docs/appcast.xml
          cp "updates/ScreenshotShelf-${VERSION}.md" "docs/ScreenshotShelf-${VERSION}.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            "updates/ScreenshotShelf-${VERSION}.dmg" \
            --title "ScreenshotShelf ${VERSION}" \
            --generate-notes

      - name: Publish Sparkle appcast
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "docs/appcast.xml" /tmp/ScreenshotShelf-appcast.xml
          cp "docs/ScreenshotShelf-${TAG#v}.md" /tmp/ScreenshotShelf-release-notes.md
          git checkout -B main origin/main
          git pull --ff-only origin main
          mkdir -p docs
          cp /tmp/ScreenshotShelf-appcast.xml docs/appcast.xml
          cp /tmp/ScreenshotShelf-release-notes.md "docs/ScreenshotShelf-${TAG#v}.md"
          git add docs/appcast.xml "docs/ScreenshotShelf-${TAG#v}.md"
          git commit -m "chore: update appcast for ${TAG}" || exit 0
          git push origin main
